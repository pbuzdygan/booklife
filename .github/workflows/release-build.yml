name: Release build

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-build-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ github.event.release.target_commitish }} release image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHANNEL: ${{ github.event.release.target_commitish }}
      REF: ${{ github.event.release.tag_name }}
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate release channel
        shell: bash
        run: |
          case "$CHANNEL" in
            main|dev) ;;
            *)
              echo "A release must target main or dev; received: $CHANNEL"
              exit 1
              ;;
          esac

      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image-tags
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            main)
              tags="$IMAGE:latest,$IMAGE:$VERSION"
              ;;
            dev)
              tags="$IMAGE:dev_latest,$IMAGE:dev_$VERSION"
              ;;
            *)
              echo "Unsupported release channel: $CHANNEL" >&2
              exit 1
              ;;
          esac
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
